name: Build & deploy Workmate (dev)

on:
  push:
    branches: [main]

concurrency:
  group: workmate-deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Self-hosted, running on the cluster's own arm64 node -- builds natively for the node's
    # actual architecture, no QEMU cross-compilation. QEMU-emulated npm installs on GitHub-hosted
    # x86 runners were multi-minute and occasionally crashed outright ("Illegal instruction - core
    # dumped"), taking the whole job down with them.
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-api:${{ env.IMAGE_TAG }}

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-web:${{ env.IMAGE_TAG }}

      - name: Checkout cluster-config
        uses: actions/checkout@v4
        with:
          repository: teamunwritten/cluster-config
          token: ${{ secrets.PAT_TOKEN }}
          path: cluster-config

      - name: Install yq
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            BIN="yq_linux_arm64"
          else
            BIN="yq_linux_amd64"
          fi
          sudo curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/${BIN}" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes manifests
        run: |
          APP_PATH="cluster-config/apps/workmate-dev"
          echo "Updating images to tag: $IMAGE_TAG"

          yq -i '
            (select(.kind == "Deployment" and .metadata.name == "workmate-api")
            .spec.template.spec.containers[0].image) = "'"${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-api:${IMAGE_TAG}"'"
          ' "$APP_PATH/03-backend-deployment.yaml"

          yq -i '
            (select(.kind == "Deployment" and .metadata.name == "workmate-frontend")
            .spec.template.spec.containers[0].image) = "'"${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-web:${IMAGE_TAG}"'"
          ' "$APP_PATH/04-frontend.yaml"

      - name: Wake the dev instance back up
        run: |
          APP_PATH="cluster-config/apps/workmate-dev"
          # A prior promotion scales these to 0 to kill the idle dev instance. A fresh merge
          # to main means someone wants dev running again, so bring it back up.
          yq -i '(select(.kind == "Deployment" and .metadata.name == "mysql") .spec.replicas) = 1' "$APP_PATH/02-mysql.yaml"
          yq -i '(select(.kind == "Deployment" and .metadata.name == "workmate-api") .spec.replicas) = 1' "$APP_PATH/03-backend-deployment.yaml"
          yq -i '(select(.kind == "Deployment" and .metadata.name == "workmate-frontend") .spec.replicas) = 1' "$APP_PATH/04-frontend.yaml"

      - name: Commit & push cluster-config
        run: |
          cd cluster-config
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps/workmate-dev/02-mysql.yaml apps/workmate-dev/03-backend-deployment.yaml apps/workmate-dev/04-frontend.yaml
          git commit -m "Deploy workmate-dev: ${IMAGE_TAG}" || echo "No changes to commit"
          git push
