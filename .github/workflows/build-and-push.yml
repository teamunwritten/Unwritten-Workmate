name: Build & deploy Workmate

on:
  push:
    branches: [main]

concurrency:
  group: workmate-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Use GitHub-hosted runners so jobs start immediately. For a private
    # cluster builder instead, switch to runs-on: self-hosted and ensure a
    # runner is online (Settings → Actions → Runners).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-api:${{ env.IMAGE_TAG }}

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-web:${{ env.IMAGE_TAG }}

      - name: Checkout cluster-config
        uses: actions/checkout@v4
        with:
          repository: teamunwritten/cluster-config
          token: ${{ secrets.PAT_TOKEN }}
          path: cluster-config

      - name: Install yq
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            BIN="yq_linux_arm64"
          else
            BIN="yq_linux_amd64"
          fi
          sudo curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/${BIN}" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Kubernetes manifests
        run: |
          APP_PATH="cluster-config/apps/workmate"
          echo "Updating images to tag: $IMAGE_TAG"

          yq -i '
            (select(.kind == "Deployment" and .metadata.name == "workmate-api")
            .spec.template.spec.containers[0].image) = "'"${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-api:${IMAGE_TAG}"'"
          ' "$APP_PATH/03-backend-deployment.yaml"

          yq -i '
            (select(.kind == "Deployment" and .metadata.name == "workmate-frontend")
            .spec.template.spec.containers[0].image) = "'"${{ secrets.DOCKERHUB_USERNAME }}/unwritten-workmate-web:${IMAGE_TAG}"'"
          ' "$APP_PATH/04-frontend.yaml"

      - name: Commit & push cluster-config
        run: |
          cd cluster-config
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps/workmate/03-backend-deployment.yaml apps/workmate/04-frontend.yaml
          git commit -m "Deploy workmate: ${IMAGE_TAG}" || echo "No changes to commit"
          git push
